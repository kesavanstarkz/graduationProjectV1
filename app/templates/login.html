<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Clinical Quality AI</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 0;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }

        .auth-container {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header h2 {
            color: white;
            font-size: 1.8rem;
            margin-bottom: 8px;
            background: none;
            -webkit-text-fill-color: initial;
        }

        .auth-header p {
            color: #94a3b8;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #e2e8f0;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            transition: all 0.2s;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: #2563eb;
            background: rgba(15, 23, 42, 0.8);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        .auth-btn {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }

        .auth-btn:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        .auth-btn:active {
            transform: translateY(0);
        }

        .auth-footer {
            text-align: center;
            margin-top: 25px;
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .auth-footer a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .status-msg {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
        }

        .status-msg.error {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.2);
            display: block;
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="auth-header">
            <h2 id="authTitle"><i class="fas fa-heartbeat"></i> Clinical AI</h2>
            <p id="authSubtitle">Welcome back! Please login.</p>
        </div>

        <div id="statusBox" class="status-msg"></div>

        <form id="authForm">
            <div id="regFields" style="display: none;">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="doctor@hospital.com">
                </div>
            </div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" required placeholder="Enter username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" id="submitBtn" class="auth-btn">Login</button>
        </form>

        <div class="auth-footer">
            <span id="toggleText">Don't have an account?</span>
            <a href="#" id="toggleLink">Register Now</a>
        </div>
    </div>

    <script>
        let isLogin = true;

        const toggleLink = document.getElementById('toggleLink');
        const authTitle = document.getElementById('authTitle');
        const authSubtitle = document.getElementById('authSubtitle');
        const regFields = document.getElementById('regFields');
        const submitBtn = document.getElementById('submitBtn');
        const toggleText = document.getElementById('toggleText');
        const authForm = document.getElementById('authForm');
        const statusBox = document.getElementById('statusBox');

        toggleLink.addEventListener('click', (e) => {
            e.preventDefault();
            isLogin = !isLogin;

            if (isLogin) {
                authSubtitle.innerText = 'Welcome back! Please login.';
                regFields.style.display = 'none';
                submitBtn.innerText = 'Login';
                toggleText.innerText = "Don't have an account?";
                toggleLink.innerText = 'Register Now';
                document.getElementById('email').required = false;
            } else {
                authSubtitle.innerText = 'Create your clinical audit account.';
                regFields.style.display = 'block';
                submitBtn.innerText = 'Register';
                toggleText.innerText = "Already have an account?";
                toggleLink.innerText = 'Login instead';
                document.getElementById('email').required = true;
            }
        });

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            statusBox.className = 'status-msg';
            statusBox.innerText = '';

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                let response;
                if (isLogin) {
                    const formData = new FormData();
                    formData.append('username', username);
                    formData.append('password', password);

                    response = await fetch('/auth/login', {
                        method: 'POST',
                        body: formData
                    });
                } else {
                    const email = document.getElementById('email').value;
                    response = await fetch('/auth/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, email, password })
                    });
                }

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.access_token);
                    window.location.href = '/';
                } else {
                    statusBox.innerText = data.detail || 'Authentication failed';
                    statusBox.className = 'status-msg error';
                }
            } catch (err) {
                statusBox.innerText = 'System error. Try again.';
                statusBox.className = 'status-msg error';
            }
        });

        // If already logged in, redirect to home
        if (localStorage.getItem('token')) {
            window.location.href = '/';
        }
    </script>
</body>

</html>
